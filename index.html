<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dashboard — meerkats demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    /* tokens — verbatim from the design handoff (design/tokens/*.css) */
    --surface-page:#FAFAF9; --surface-card:#FFFFFF; --surface-sunken:#F4F4F2; --surface-tint:#FFF7F2;
    --ink-900:#0B0B0C; --ink-700:#2A2A2E; --ink-500:#5C5C63; --ink-400:#8A8A92; --ink-300:#B4B4BA;
    --rule:#E4E4E7; --rule-strong:#111113; --rule-grid:#EFEFEC;
    --accent:#EA580C; --accent-hover:#C2410C; --good:#15803D; --bad:#B91C1C;
    --series-1:#4285F4; --series-2:#EA4335; --series-3:#FBBC04; --series-4:#34A853;
    --series-5:#7E57C2; --series-6:#00ACC1; --series-7:#E91E63; --series-8:#8D6E63;
    --series-compare:#8A8A92; --series-dim:#D4D4D7; --bar-track:#F4F4F2;
    --heat-1:#E8F0FE; --heat-2:#AECBFA; --heat-3:#669DF6; --heat-4:#1A73E8; --heat-5:#174EA6;
    --chart-axis:#8A8A92; --chart-crosshair:#0B0B0C;
    --font-ui:'Geist',system-ui,-apple-system,sans-serif; --font-mono:'Geist Mono',ui-monospace,monospace;
    --font-display:'Instrument Serif',Georgia,serif;
    --fs-title:26px; --fs-kpi:28px; --fs-card:15px; --fs-body:13px; --fs-label:12px; --fs-micro:11px;
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  *{box-sizing:border-box} body{margin:0;background:var(--surface-page);color:var(--ink-700);font:var(--fs-body)/1.45 var(--font-ui)}
  .num{font-variant-numeric:tabular-nums}
  .topbar{background:var(--surface-card);border-bottom:1px solid var(--rule)}
  .topbar-in{max-width:1440px;margin:0 auto;padding:14px 24px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .wordmark{font:400 var(--fs-title)/1 var(--font-display);color:var(--ink-900)}
  .client{font:500 var(--fs-micro) var(--font-mono);letter-spacing:.06em;color:var(--ink-400)}
  .topbar-in select{margin-left:auto}
  .wrap{max-width:1440px;margin:0 auto;padding:24px}
  .mono{font-family:var(--font-mono);font-size:var(--fs-micro);color:var(--ink-400);text-transform:lowercase}
  select,button{font:500 var(--fs-label)/1 var(--font-ui);border:1px solid var(--rule);background:var(--surface-card);color:var(--ink-700);border-radius:4px;padding:0 10px;height:28px;cursor:pointer;transition:background 120ms var(--ease),color 120ms var(--ease)}
  select:hover,button:hover{background:var(--surface-sunken)}
  .card{background:var(--surface-card);border:1px solid var(--rule);border-radius:6px;margin-bottom:16px}
  .card-h{padding:14px 20px 10px;border-bottom:1.5px solid var(--rule-strong);display:flex;align-items:flex-start;gap:12px}
  .card-h .tw{flex:1;min-width:0}
  .card-h .t{font-size:var(--fs-card);font-weight:600;color:var(--ink-900)} .card-h .q{font-size:var(--fs-label);color:var(--ink-500);margin-top:2px}
  .card-h .meta{font-family:var(--font-mono);font-size:var(--fs-micro);color:var(--ink-400);text-transform:lowercase;white-space:nowrap;padding-top:3px}
  .pinbtn{border:1px solid var(--rule);background:var(--surface-card);width:28px;padding:0;color:var(--ink-400);display:inline-flex;align-items:center;justify-content:center}
  .pinbtn.pinned{color:var(--accent);border-color:var(--accent);background:var(--surface-tint)}
  .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 20px;border-bottom:1px solid var(--rule)}
  .controls .chip{font:500 var(--fs-label)/1 var(--font-ui);border:1px solid var(--rule);border-radius:4px;padding:6px 10px;color:var(--ink-500);background:var(--surface-sunken)}
  .body{padding:16px 20px 20px;overflow-x:auto;position:relative}
  .foot{padding:8px 20px;border-top:1px solid var(--rule);font-family:var(--font-mono);font-size:var(--fs-micro);color:var(--ink-400);text-transform:lowercase;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
  .kpi .lab{font-size:var(--fs-label);color:var(--ink-500)}
  .kpi .v{font-size:var(--fs-kpi);font-weight:600;color:var(--ink-900);font-variant-numeric:tabular-nums;line-height:1.15;margin-top:2px}
  .kpi .d{font-family:var(--font-mono);font-size:var(--fs-micro);margin-top:2px} .up{color:var(--good)} .down{color:var(--bad)}
  svg text{font:var(--fs-micro) var(--font-mono);fill:var(--chart-axis)} svg .val{fill:var(--ink-700)}
  table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
  th{height:36px;padding:0 12px;font-size:var(--fs-label);font-weight:500;color:var(--ink-500);background:var(--surface-sunken);text-align:right;white-space:nowrap}
  td{height:36px;padding:0 12px;font-size:var(--fs-body);color:var(--ink-700);text-align:right;border-bottom:1px solid var(--rule);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  th:first-child,td:first-child{text-align:left}
  tr:hover td{background:var(--surface-sunken)}
  .crumbs{padding:8px 20px;font-family:var(--font-mono);font-size:var(--fs-micro);color:var(--ink-400);border-bottom:1px solid var(--rule);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .crumb{background:var(--surface-tint);border:1px solid var(--accent);border-radius:3px;padding:2px 6px;color:var(--ink-700);cursor:pointer}
  .crumb:hover{text-decoration:line-through}
  .restore{padding:12px 16px;border:1px dashed var(--rule);border-radius:6px;font-size:var(--fs-body);color:var(--ink-500);display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .restore button{border:0;background:none;color:var(--accent);font-weight:500}
  .libitem{display:flex;align-items:center;gap:12px;background:var(--surface-card);border:1px solid var(--rule);border-radius:6px;padding:10px 16px;margin-bottom:8px}
  .libitem .t{font-size:var(--fs-body);font-weight:500;color:var(--ink-900)}
  .libitem .rep{font-family:var(--font-mono);font-size:var(--fs-micro);color:var(--ink-400);text-transform:lowercase}
  .libitem .sp{flex:1}
  .tooltip{position:absolute;pointer-events:none;background:var(--ink-900);color:#fff;border-radius:4px;padding:6px 10px;font-size:var(--fs-label);line-height:1.3;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.18);display:none}
  .tooltip .tl{font-family:var(--font-mono);font-size:var(--fs-micro);color:var(--ink-300)}
  .legend{display:flex;gap:16px;padding:6px 0 0 52px;flex-wrap:wrap;font-size:var(--fs-label);color:var(--ink-500)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  a.xlink{color:var(--accent);text-decoration:none;font-weight:500} .note{font-family:var(--font-mono);font-size:var(--fs-micro);color:var(--ink-400);padding-top:8px;text-transform:lowercase}
</style>
</head>
<body>
<div class="topbar"><div class="topbar-in">
  <span class="wordmark">Dashboard</span><span class="client">AREOVEDA · INR</span>
  <select id="platform"></select>
</div></div>
<div class="wrap">
  <div id="stack"></div>
</div>
<script src="cockpit.js?v=3"></script>
</body>
</html>
